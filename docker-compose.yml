# Remote: nur Images ziehen, nie `build:` für photobuddy.
#   docker compose pull && docker compose up -d
#
# Alles: docker compose up -d
# Nur Postgres (npm run dev): docker compose up -d db
#
# Ports: App 3388 · Postgres nur localhost:5432
# Volumes: photobuddy-db, photobuddy-photos, photobuddy-secrets, photobuddy-vapid
# Secrets: .env (npm run setup)

name: photobuddy

services:
  db:
    image: postgres:16
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - photobuddy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobuddy -d photobuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: photobuddy
      POSTGRES_DB: photobuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt — npm run setup}

  # Photobuddy Next.js — GHCR only. Do not add build: here.
  photobuddy:
    image: ghcr.io/rolfwalker71-commits/photobuddy:${TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3388}:${PORT:-3388}"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3388}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:photobuddy@localhost}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt — npm run setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt — npm run setup}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@photobuddy.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PHOTOS_DIR: /data/photos
      PORT: ${PORT:-3388}
    volumes:
      - vapid-keys:/data/vapid
      - photobuddy-photos:/data/photos
      - photobuddy-secrets:/secrets:ro

volumes:
  photobuddy-db:
    name: photobuddy-db
  photobuddy-photos:
    name: photobuddy-photos
  photobuddy-secrets:
    name: photobuddy-secrets
  vapid-keys:
    name: photobuddy-vapid
