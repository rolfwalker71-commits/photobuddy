<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Photobuddy — Kartenstile vergleichen</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --background: hsl(36 40% 97%);
        --foreground: hsl(200 18% 12%);
        --card: hsl(40 45% 99%);
        --muted: hsl(32 24% 92%);
        --muted-foreground: hsl(200 10% 38%);
        --primary: hsl(173 72% 26%);
        --border: hsl(30 18% 84%);
      }

      html {
        font-size: 112.5%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 30;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        background: color-mix(in srgb, var(--background) 90%, transparent);
        backdrop-filter: blur(12px);
      }

      header h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      header p {
        margin: 0.15rem 0 0;
        font-size: 0.875rem;
        line-height: 1.35;
        color: var(--muted-foreground);
        overflow-wrap: anywhere;
      }

      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem 1rem 2.5rem;
      }

      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr;
      }

      @media (min-width: 40rem) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 64rem) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      figure {
        margin: 0;
        overflow: hidden;
        border-radius: 1rem;
        background: var(--card);
        box-shadow: 0 1px 2px color-mix(in srgb, var(--foreground) 6%, transparent);
        outline: 1px solid var(--border);
      }

      .map {
        height: 14rem;
        width: 100%;
        background: var(--muted);
      }

      @media (min-width: 40rem) {
        .map {
          height: 16rem;
        }
      }

      figcaption {
        padding: 0.65rem 0.75rem 0.75rem;
      }

      figcaption strong {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      figcaption span {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.875rem;
        line-height: 1.35;
        color: var(--muted-foreground);
        overflow-wrap: anywhere;
      }

      .leaflet-container {
        font-family: inherit;
        background: var(--muted);
      }

      .leaflet-control-attribution {
        background: color-mix(in srgb, var(--card) 88%, transparent) !important;
        color: var(--foreground);
        font-size: 0.625rem;
        line-height: 1.3;
      }

      .leaflet-control-attribution a {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Kartenstile vergleichen</h1>
      <p>Altdorf UR · 46.8806, 8.6444 · Zoom 16 · Photobuddy</p>
    </header>
    <main>
      <div class="grid" id="grid"></div>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const CENTER = [46.8806, 8.6444];
      const ZOOM = 16;
      const OSM_ATTR =
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
      const CARTO_ATTR =
        OSM_ATTR + ' &copy; <a href="https://carto.com/attributions">CARTO</a>';
      const ESRI_PREFIX = "Kacheln &copy; Esri — ";

      const STYLES = [
        {
          id: "voyager",
          label: "Voyager",
          description: "Bunt und übersichtlich",
          url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
          attribution: CARTO_ATTR,
          maxZoom: 20,
          subdomains: "abcd",
        },
        {
          id: "positron",
          label: "Positron",
          description: "Hell und schlicht",
          url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
          attribution: CARTO_ATTR,
          maxZoom: 20,
          subdomains: "abcd",
        },
        {
          id: "dark-matter",
          label: "Dark Matter",
          description: "Dunkel, passend zum Nachtmodus",
          url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
          attribution: CARTO_ATTR,
          maxZoom: 20,
          subdomains: "abcd",
        },
        {
          id: "voyager-nolabels",
          label: "Voyager ohne Text",
          description: "Bunt, ohne Ortsnamen",
          url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",
          attribution: CARTO_ATTR,
          maxZoom: 20,
          subdomains: "abcd",
        },
        {
          id: "osm",
          label: "OpenStreetMap",
          description: "Klassisch, viele Beschriftungen",
          url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          attribution: OSM_ATTR,
          maxZoom: 19,
          subdomains: "abc",
        },
        {
          id: "osm-de",
          label: "OpenStreetMap DE",
          description: "Deutsche Kachelserver",
          url: "https://tile.openstreetmap.de/{z}/{x}/{y}.png",
          attribution: OSM_ATTR,
          maxZoom: 18,
        },
        {
          id: "osm-hot",
          label: "Humanitär",
          description: "HOT-Stil, klar und kontrastreich",
          url: "https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
          attribution:
            OSM_ATTR +
            ', Stil: <a href="https://www.hotosm.org/">Humanitarian OpenStreetMap Team</a>, bereitgestellt von <a href="https://www.openstreetmap.fr/">OpenStreetMap France</a>',
          maxZoom: 19,
          subdomains: "abc",
        },
        {
          id: "cyclosm",
          label: "CyclOSM",
          description: "Radwege und Radrouten",
          url: "https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png",
          attribution: '<a href="https://www.cyclosm.org">CyclOSM</a> | ' + OSM_ATTR,
          maxZoom: 20,
          subdomains: "abc",
        },
        {
          id: "opnvkarte",
          label: "ÖPNVKarte",
          description: "Bus, Bahn und ÖPNV",
          url: "https://tile.memomaps.de/tilegen/{z}/{x}/{y}.png",
          attribution:
            'Karte <a href="https://www.öpnvkarte.de/">ÖPNVKarte</a> / <a href="https://memomaps.de/">memomaps.de</a> (<a href="https://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA</a>), ' +
            OSM_ATTR,
          maxZoom: 18,
        },
        {
          id: "topo",
          label: "OpenTopoMap",
          description: "Gelände und Wanderwege",
          url: "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
          attribution:
            "Kartendaten: " +
            OSM_ATTR +
            ', <a href="https://viewfinderpanoramas.org">SRTM</a> | Darstellung: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)',
          maxZoom: 17,
          subdomains: "abc",
        },
        {
          id: "satellite",
          label: "Satellit",
          description: "Luftbild (Esri)",
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          attribution:
            "Kacheln &copy; Esri — Quelle: Esri, Maxar, Earthstar Geographics und die GIS-User-Community",
          maxZoom: 19,
        },
        {
          id: "esri-street",
          label: "Esri Straßen",
          description: "Straßenkarte weltweit",
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
          attribution:
            ESRI_PREFIX +
            "Quelle: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom",
          maxZoom: 19,
        },
        {
          id: "esri-topo",
          label: "Esri Topo",
          description: "Topografische Karte",
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
          attribution:
            ESRI_PREFIX +
            "Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong) und die GIS-User-Community",
          maxZoom: 19,
        },
        {
          id: "esri-gray",
          label: "Esri Grau",
          description: "Hellgrau, zurückhaltend",
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
          attribution: ESRI_PREFIX + "Esri, DeLorme, NAVTEQ",
          maxZoom: 16,
        },
        {
          id: "esri-oceans",
          label: "Esri Ozean",
          description: "Meere und Küsten",
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",
          attribution:
            ESRI_PREFIX +
            "Quellen: GEBCO, NOAA, CHS, OSU, UNH, CSUMB, National Geographic, DeLorme, NAVTEQ und Esri",
          maxZoom: 13,
        },
      ];

      const grid = document.getElementById("grid");

      STYLES.forEach(function (style) {
        const zoom = Math.min(ZOOM, style.maxZoom);
        const figure = document.createElement("figure");
        const mapEl = document.createElement("div");
        mapEl.className = "map";
        mapEl.id = "map-" + style.id;
        const caption = document.createElement("figcaption");
        const title = document.createElement("strong");
        title.textContent = style.label;
        const desc = document.createElement("span");
        desc.textContent =
          style.description +
          (zoom < ZOOM ? " · Zoom " + zoom + " (Maximum des Stils)" : "");
        caption.appendChild(title);
        caption.appendChild(desc);
        figure.appendChild(mapEl);
        figure.appendChild(caption);
        grid.appendChild(figure);

        const map = L.map(mapEl, {
          center: CENTER,
          zoom: zoom,
          maxZoom: style.maxZoom,
          scrollWheelZoom: false,
        });

        const options = {
          attribution: style.attribution,
          maxZoom: style.maxZoom,
        };
        if (style.subdomains) options.subdomains = style.subdomains;
        L.tileLayer(style.url, options).addTo(map);
        L.circleMarker(CENTER, {
          radius: 6,
          color: "#0f766e",
          fillColor: "#0f766e",
          fillOpacity: 0.85,
          weight: 2,
          interactive: false,
        }).addTo(map);

        requestAnimationFrame(function () {
          map.invalidateSize();
        });
      });
    </script>
  </body>
</html>
